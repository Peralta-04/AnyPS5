name: Build AnyPS5 Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout AnyPS5
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y

      - name: Download required MinGW GCC 15.2.0
        shell: powershell
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/tags/15.2.0posix-14.0.0-ucrt-r7" `
            -Headers @{ "User-Agent" = "GitHub-Actions" }

          $asset = $release.assets |
            Where-Object {
              $_.name -eq "winlibs-x86_64-ucrt-posix-seh-gcc-15.2.0-mingw-w64-14.0.0-r7.zip"
            } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Host "Available assets:"
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Required MinGW asset was not found."
          }

          Write-Host "Downloading:"
          Write-Host $asset.browser_download_url

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile "$env:RUNNER_TEMP\mingw.zip"

          Expand-Archive `
            -Path "$env:RUNNER_TEMP\mingw.zip" `
            -DestinationPath "$env:RUNNER_TEMP\mingw"

      - name: Locate MinGW
        shell: powershell
        run: |
          $gcc = Get-ChildItem `
            "$env:RUNNER_TEMP\mingw" `
            -Filter gcc.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $gcc) {
            Get-ChildItem "$env:RUNNER_TEMP\mingw" -Recurse | Select-Object -First 50
            throw "gcc.exe not found"
          }

          $mingwBin = $gcc.Directory.FullName

          Write-Host "MinGW bin:"
          Write-Host $mingwBin

          Add-Content $env:GITHUB_PATH $mingwBin
          Add-Content $env:GITHUB_ENV "MINGW_BIN=$mingwBin"

      - name: Check compiler
        shell: powershell
        run: |
          gcc --version
          g++ --version
          ninja --version
          cmake --version

      - name: Configure AnyPS5
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++

      - name: Build AnyPS5
        shell: powershell
        run: |
          cmake --build build --parallel

      - name: Build libraries
        shell: powershell
        run: |
          cmake --build build --target libs --parallel

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "===== EXE FILES ====="
          Get-ChildItem build -Recurse -Filter *.exe

          Write-Host "===== PRX FILES ====="
          Get-ChildItem build -Recurse -Filter *.prx

      - name: Package build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release

          Get-ChildItem build -Recurse -Filter *.exe |
            Copy-Item -Destination release -Force

          Get-ChildItem build -Recurse -Filter *.prx |
            Copy-Item -Destination release -Force

          Compress-Archive `
            -Path release\* `
            -DestinationPath AnyPS5-Windows.zip `
            -Force

      - name: Upload AnyPS5 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5-Windows
          path: AnyPS5-Windows.zip
